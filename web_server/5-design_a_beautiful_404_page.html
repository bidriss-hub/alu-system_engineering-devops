<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Page Not Found</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 80px;
}

h1 {
    font-size: 100px;
    color: #ff4757;
    margin: 0;
}

p {
    font-size: 30px;
}

a {
    color: #1e90ff;
    text-decoration: none;
}

.box {
    border: 3px solid #ff4757;
    border-radius: 15px;
    display: inline-block;
    padding: 40px;
}
</style>
</head>

<body>
<div class="box">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <p>The page you are looking for does not exist.</p>
    <a href="/">Return Home</a>
</div>
</body>
</html>
